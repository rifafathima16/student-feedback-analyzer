<!DOCTYPE html>
<html lang='en'>
<head>
    <meta charset='UTF-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1.0'>
    <title>Student Feedback Analyzer</title>
    <link rel='stylesheet' href='{{ url_for('static', filename='style.css') }}'>
</head>
<body>
    <div class='container'>
        <h1>Submit Student Feedback</h1>
        <!-- Flash messages for validation errors -->
        {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
        {% for category, message in messages %}
        <div class="flash {{ category }}">{{ message }}</div>
        {% endfor %}
        {% endif %}
        {% endwith %}
        <form method='POST'>
            <label for='name'>Student Name (optional):</label>
            <input type='text' id='name' name='name' value="{{ name|default('') }}">

            <label for='subject'>Course / Subject:</label>
            <select id='subject' name='subject' required>
                <option value='' disabled {% if not subject %}selected{% endif %}>Select a subject</option>
                <option {% if subject == 'Mathematics' %}selected{% endif %}>Mathematics</option>
                <option {% if subject == 'Science' %}selected{% endif %}>Science</option>
                <option {% if subject == 'History' %}selected{% endif %}>History</option>
                <option {% if subject == 'Literature' %}selected{% endif %}>Literature</option>
                <option {% if subject == 'Computer Science' %}selected{% endif %}>Computer Science</option>
            </select>

            <label for='faculty'>Faculty Name:</label>
            <select id='faculty' name='faculty' required>
                <option value='' disabled {% if not faculty %}selected{% endif %}>Select faculty</option>
                <option {% if faculty == 'Dr. Smith' %}selected{% endif %}>Dr. Smith</option>
                <option {% if faculty == 'Prof. Johnson' %}selected{% endif %}>Prof. Johnson</option>
                <option {% if faculty == 'Dr. Lee' %}selected{% endif %}>Dr. Lee</option>
                <option {% if faculty == 'Prof. Patel' %}selected{% endif %}>Prof. Patel</option>
            </select>

            <label for='rating'>Rating (1-5):</label>
            <select id='rating' name='rating' required>
                <option value='' disabled {% if not rating %}selected{% endif %}>Select rating</option>
                <option {% if rating == '1' %}selected{% endif %}>1</option>
                <option {% if rating == '2' %}selected{% endif %}>2</option>
                <option {% if rating == '3' %}selected{% endif %}>3</option>
                <option {% if rating == '4' %}selected{% endif %}>4</option>
                <option {% if rating == '5' %}selected{% endif %}>5</option>
            </select>

            <label for='comment'>Comments:</label>
            <textarea id='comment' name='comment' rows='5' required>{{ comment|default('') }}</textarea>

            <button type='submit'>Submit</button>
        </form>
        <a href='{{ url_for('dashboard') }}'>View Dashboard</a>
    </div>
</body>
</html>
